# 프런트 정적 파일 캐시: index.html은 매번 재확인, 해시가 붙은 JS·CSS는 오래 캐시
# add_header 대신 expires를 써서 server 블록의 보안 헤더(CSP·HSTS 등) 상속을 유지한다

# SPA fallback(/ 와 화면 경로)도 내부적으로 이 위치를 거치므로 재배포 직후 새 번들을 받는다
location = /index.html {
    expires -1;
    try_files $uri =404;
}

# 없는 자산은 index.html 대신 404로 응답해 재배포 후 이전 번들 요청이 빈 화면이 되지 않게 한다
location /assets/ {
    try_files $uri =404;
}

# Vite가 내용 해시를 붙인 파일(index-B0_LMh3G.js 등)은 내용이 바뀌면 이름도 바뀐다
location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    expires max;
    try_files $uri =404;
}
